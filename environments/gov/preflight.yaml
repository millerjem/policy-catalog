checks:
  - name: KMS decrypt on Vertex key
    action: kms:Decrypt
    resource: arn:${AWS_PARTITION}:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:key/${VERTEX_KMS_KEY_ID}
    expect: allowed

  - name: CloudWatch metric publish
    action: cloudwatch:PutMetricData
    resource: "*"
    expect: allowed

  - name: X-Ray telemetry
    action: xray:PutTelemetryRecords
    resource: "*"
    expect: allowed

  - name: SQS receive on Vertex queue
    action: sqs:ReceiveMessage
    resource: arn:${AWS_PARTITION}:sqs:${AWS_REGION}:${AWS_ACCOUNT_ID}:vertex-control-plane
    expect: allowed

  - name: DynamoDB leader registry update
    action: dynamodb:UpdateItem
    resource: arn:${AWS_PARTITION}:dynamodb:${AWS_REGION}:${AWS_ACCOUNT_ID}:table/vertex-prod-AWSEBWorkerCronLeaderRegistry
    expect: allowed

  - name: Vertex log stream write
    action: logs:PutLogEvents
    resource: arn:${AWS_PARTITION}:logs:${AWS_REGION}:${AWS_ACCOUNT_ID}:log-group:/aws/spectrocloud/vertex/cluster
    expect: allowed

  - name: CloudTrail logs remain denied
    action: logs:GetLogEvents
    resource: arn:${AWS_PARTITION}:logs:${AWS_REGION}:${AWS_ACCOUNT_ID}:log-group:CloudtrailSensitive
    expect: denied

  - name: RDS describe Vertex DB
    action: rds:DescribeDBInstances
    resource: arn:${AWS_PARTITION}:rds:${AWS_REGION}:${AWS_ACCOUNT_ID}:db:vertex-primary
    expect: allowed

  - name: Read Vertex instance profile
    action: iam:GetInstanceProfile
    resource: arn:${AWS_PARTITION}:iam::${AWS_ACCOUNT_ID}:instance-profile/vertex-workers
    expect: allowed

  - name: Assume elastic logstash role
    action: sts:AssumeRole
    resource: arn:${AWS_PARTITION}:iam::${AWS_ACCOUNT_ID}:role/${LOG_SHIPPER_ROLE_NAME}
    expect: allowed

  - name: ECS start task
    action: ecs:StartTask
    resource: "*"
    expect: allowed

  - name: ECR describe Vertex repo images
    action: ecr:DescribeImages
    resource: arn:${AWS_PARTITION}:ecr:${AWS_REGION}:${AWS_ACCOUNT_ID}:repository/vertex/agent
    expect: allowed

  - name: EC2 describe subnets
    action: ec2:DescribeSubnets
    resource: "*"
    expect: allowed

  - name: Tagged secret read
    action: secretsmanager:GetSecretValue
    resource: arn:${AWS_PARTITION}:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:vertex/db-password
    expect: allowed
    context:
      secretsmanager:ResourceTag/MISSION_SYSTEM_OWNED: "true"

  - name: EC2 messages reply
    action: ec2messages:SendReply
    resource: "*"
    expect: allowed

  - name: SSM parameter read
    action: ssm:GetParameter
    resource: "*"
    expect: allowed

  - name: Vertex object write
    action: s3:PutObject
    resource: arn:${AWS_PARTITION}:s3:::vertex-artifacts/cluster/bootstrap.sh
    expect: allowed

  - name: Restricted CloudTrail bucket denied
    action: s3:GetObject
    resource: arn:${AWS_PARTITION}:s3:::cloudtrail-audit/logfile
    expect: denied

  - name: SNS publish to Vertex topic
    action: sns:Publish
    resource: arn:${AWS_PARTITION}:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:vertex-events
    expect: allowed

  - name: Pass ECS task role
    action: iam:PassRole
    resource: arn:${AWS_PARTITION}:iam::${AWS_ACCOUNT_ID}:role/${ECS_TASK_ROLE_NAME}
    expect: allowed

  - name: Describe EFS file systems
    action: elasticfilesystem:DescribeFileSystems
    resource: "*"
    expect: allowed

  - name: Create EFS access point with cluster tag
    action: elasticfilesystem:CreateAccessPoint
    resource: "*"
    expect: allowed
    context:
      aws:RequestTag/efs.csi.aws.com/cluster: "true"

  - name: Delete EFS access point with cluster tag
    action: elasticfilesystem:DeleteAccessPoint
    resource: "*"
    expect: allowed
    context:
      aws:ResourceTag/efs.csi.aws.com/cluster: "true"

  - name: SSM messages control channel
    action: ssmmessages:CreateControlChannel
    resource: "*"
    expect: allowed

  - name: ECR pull image
    action: ecr:BatchGetImage
    resource: arn:${AWS_PARTITION}:ecr:${AWS_REGION}:${AWS_ACCOUNT_ID}:repository/vertex/agent
    expect: allowed
